name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
        if: matrix.node-version == 22
      - run: pnpm lint
        if: matrix.node-version == 22
      - run: pnpm --filter @berlysia/shiori run lint:boundaries
        if: matrix.node-version == 22
      - run: pnpm format:check
        if: matrix.node-version == 22
      - run: pnpm test
        if: matrix.node-version == 22
      - run: node packages/shiori-cli/dist/src/cli.js --help

      # Dogfooding: verify shiori's own annotations against registry
      - name: shiori verify (dogfooding)
        if: matrix.node-version == 22
        run: node packages/shiori-cli/dist/src/cli.js verify

      # Dogfooding: health check for governance score visibility
      - name: shiori health (dogfooding)
        if: matrix.node-version == 22
        run: node packages/shiori-cli/dist/src/cli.js health

      # Dogfooding: generate HTML governance dashboard
      - name: shiori report --format html (dogfooding)
        if: matrix.node-version == 22
        run: node packages/shiori-cli/dist/src/cli.js report --format html --output .tmp/shiori-report.html

      - name: Upload HTML governance report
        if: matrix.node-version == 22
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shiori-governance-report
          path: .tmp/shiori-report.html
          retention-days: 90
          overwrite: true
