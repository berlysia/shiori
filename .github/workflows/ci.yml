name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: {}

jobs:
  # Full quality checks on latest LTS
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@lts
          cache: true
          require-lockfile: true
      - run: pnpm build
      - run: pnpm --filter @berlysia/shiori run build:playground
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @berlysia/shiori run lint:boundaries
      - run: pnpm --filter @berlysia/shiori run lint:envelope
      - run: pnpm format:check
      - run: pnpm test
      - run: node packages/shiori-cli/dist/src/cli.js --help

      # Dogfooding: scan + verify shiori's own annotations against registry
      - name: shiori check (dogfooding)
        run: node packages/shiori-cli/dist/src/cli.js check

      # Dogfooding: health check for governance score visibility
      - name: shiori health (dogfooding)
        run: node packages/shiori-cli/dist/src/cli.js health

      # Dogfooding: GitHub Actions Step Summary (EP-0132)
      # continue-on-error: verify may exit 1 on governance violations; step summary
      # should still be written and subsequent steps (HTML report, artifact upload)
      # must not be skipped. CI pass/fail is determined by `shiori check` above.
      - name: shiori verify --format github-summary >> $GITHUB_STEP_SUMMARY
        continue-on-error: true
        run: node packages/shiori-cli/dist/src/cli.js verify --format github-summary >> "$GITHUB_STEP_SUMMARY"

      # Dogfooding: generate HTML governance dashboard
      - name: shiori report --format html (dogfooding)
        run: node packages/shiori-cli/dist/src/cli.js report --format html --output .tmp/shiori-report.html

      - name: Upload HTML governance report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shiori-governance-report
          path: .tmp/shiori-report.html
          retention-days: 90
          overwrite: true

  # Build + smoke test on the oldest supported Node.js major (engines: >=22)
  compat:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@22
          cache: true
          require-lockfile: true
      - run: pnpm build
      - run: node packages/shiori-cli/dist/src/cli.js --help
