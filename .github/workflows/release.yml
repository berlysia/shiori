name: Release
on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @berlysia/shiori run build:playground
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @berlysia/shiori run lint:boundaries
      - run: pnpm --filter @berlysia/shiori run lint:envelope
      - run: pnpm format:check
      - run: pnpm test

      # Dogfooding verification gate (release checklist: Dogfooding Verification)
      - name: shiori check
        run: node packages/shiori-cli/dist/src/cli.js check

      - name: shiori doctor
        run: node packages/shiori-cli/dist/src/cli.js doctor

  github-release:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @berlysia/shiori run build:bundle

      - name: Package release archive
        run: |
          cp packages/shiori-cli/dist/shiori-bundle.mjs shiori
          chmod +x shiori
          tar czf "shiori-${GITHUB_REF_NAME}.tar.gz" shiori
          rm shiori

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" --generate-notes "shiori-${TAG_NAME}.tar.gz"
