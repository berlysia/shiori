name: shiori PR description

on:
  pull_request:
    branches: [master]

permissions: {}

jobs:
  delta-description:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@lts
          cache: true
          require-lockfile: true

      - run: pnpm build

      # Download baseline artifact from the latest main branch workflow run
      # actions/download-artifact@v4 only works within the same workflow run,
      # so we use the GitHub API to fetch cross-workflow artifacts.
      - name: Download baseline scan artifact
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Find the latest successful run of 'shiori baseline' workflow on main
            const workflows = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const baselineWorkflow = workflows.data.workflows.find(
              w => w.name === 'shiori baseline'
            );
            if (!baselineWorkflow) {
              console.log('No baseline workflow found, skipping');
              return;
            }

            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: baselineWorkflow.id,
              branch: 'master',
              status: 'success',
              per_page: 1,
            });
            if (runs.data.workflow_runs.length === 0) {
              console.log('No successful baseline runs found, skipping');
              return;
            }

            const runId = runs.data.workflow_runs[0].id;

            // List artifacts for that run
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const artifact = artifacts.data.artifacts.find(
              a => a.name === 'shiori-base-scan'
            );
            if (!artifact) {
              console.log('No baseline scan artifact found, skipping');
              return;
            }

            // Download the artifact
            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifact.id,
              archive_format: 'zip',
            });

            // Write zip to temp and extract
            fs.mkdirSync('.tmp', { recursive: true });
            const zipPath = '.tmp/shiori-base-scan.zip';
            fs.writeFileSync(zipPath, Buffer.from(download.data));

            require('child_process').execFileSync('unzip', ['-o', zipPath, '-d', '.tmp/']);
            console.log('Baseline scan artifact downloaded successfully');
        continue-on-error: true

      # Scan PR head annotations
      - name: Scan annotations (PR head)
        run: node packages/shiori-cli/dist/src/cli.js scan --output .tmp/shiori-head-scan.json

      # Compute delta and generate Markdown report
      - name: Compute delta
        id: delta
        run: |
          node packages/shiori-cli/dist/src/cli.js delta \
            --base .tmp/shiori-base-scan.json \
            --head .tmp/shiori-head-scan.json \
            --format markdown \
            --base-fallback-empty \
            --max-increase 0 \
            --output .tmp/shiori-delta.md
        continue-on-error: true

      # Generate triage report for technical debt visibility
      - name: Generate triage report
        run: |
          node packages/shiori-cli/dist/src/cli.js triage \
            --format markdown \
            --output .tmp/shiori-triage.md
        continue-on-error: true

      # Replace marker sections in PR Description with delta and triage reports
      - name: Update PR description
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');

            // Read delta report
            let deltaContent;
            try {
              deltaContent = fs.readFileSync('.tmp/shiori-delta.md', 'utf-8').trim();
            } catch {
              deltaContent = '_No delta report generated._';
            }

            // Read triage report
            let triageContent;
            try {
              triageContent = fs.readFileSync('.tmp/shiori-triage.md', 'utf-8').trim();
            } catch {
              triageContent = '_No triage report generated._';
            }

            // Get current PR description
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            let body = pr.body || '';

            // Helper: replace content between markers or append section
            function replaceSection(body, startMarker, endMarker, content, heading) {
              const startIdx = body.indexOf(startMarker);
              const endIdx = body.indexOf(endMarker);

              if (startIdx !== -1 && endIdx !== -1) {
                return (
                  body.substring(0, startIdx + startMarker.length) +
                  '\n' + content + '\n' +
                  body.substring(endIdx)
                );
              } else {
                return (
                  body +
                  '\n\n## ' + heading + '\n\n' +
                  startMarker + '\n' +
                  content + '\n' +
                  endMarker
                );
              }
            }

            // Update delta section
            body = replaceSection(
              body,
              '<!-- shiori-delta-start -->',
              '<!-- shiori-delta-end -->',
              deltaContent,
              'Governance Summary',
            );

            // Update triage section
            body = replaceSection(
              body,
              '<!-- shiori-triage-start -->',
              '<!-- shiori-triage-end -->',
              triageContent,
              'Triage Report',
            );

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body: body,
            });

      # Fail CI if annotation count exceeded threshold
      - name: Fail if annotation count increased
        if: steps.delta.outcome == 'failure'
        run: |
          echo "::error::shiori delta: annotation count exceeded --max-increase threshold"
          exit 1
