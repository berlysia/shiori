name: shiori coach broadcast

on:
  schedule:
    # Weekly: Monday 9:00 JST (0:00 UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  broadcast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Restore previous coach snapshots for diff injection
      - name: Restore coach snapshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coach-snapshot
          path: .config/shiori/coach-snapshots/
        continue-on-error: true

      # Generate Slack-formatted coach prompt with snapshot diff
      - name: Generate coach prompt
        run: |
          node packages/shiori-cli/dist/src/cli.js coach \
            --template health \
            --format slack-markdown \
            --snapshot-dir .config/shiori/coach-snapshots \
            > /tmp/coach-output.txt

      # Post to Slack via Incoming Webhook (requires SLACK_WEBHOOK secret)
      - name: Post to Slack
        if: env.SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          ADVICE=$(cat /tmp/coach-output.txt)
          curl -s -X POST "$SLACK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg text "$ADVICE" '{ text: $text }')"

      # Save coach snapshot for next run's diff comparison
      - name: Upload coach snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coach-snapshot
          path: .config/shiori/coach-snapshots/
          retention-days: 90
          overwrite: true
