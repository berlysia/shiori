name: shiori baseline

on:
  push:
    branches: [master]

permissions: {}

jobs:
  scan-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Scan annotations (baseline)
        run: node packages/shiori-cli/dist/src/cli.js scan --output .tmp/shiori-base-scan.json

      - name: Upload baseline scan artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shiori-base-scan
          path: .tmp/shiori-base-scan.json
          retention-days: 90
          overwrite: true

      # Save health snapshot for trend analysis over time
      - name: Save health snapshot
        run: node packages/shiori-cli/dist/src/cli.js health --snapshot .tmp/snapshots/ -f json

      - name: Upload health snapshot artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shiori-health-snapshot
          path: .tmp/snapshots/
          retention-days: 90
          overwrite: true
