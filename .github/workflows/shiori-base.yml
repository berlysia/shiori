name: shiori baseline

on:
  push:
    branches: [master]

permissions: {}

jobs:
  scan-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Scan annotations (baseline)
        run: node packages/shiori-cli/dist/src/cli.js scan --output .tmp/shiori-base-scan.json

      - name: Upload baseline scan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shiori-base-scan
          path: .tmp/shiori-base-scan.json
          retention-days: 90
          overwrite: true

      # Save health snapshot for trend analysis over time
      - name: Save health snapshot
        run: node packages/shiori-cli/dist/src/cli.js health --snapshot .tmp/snapshots/ -f json

      - name: Upload health snapshot artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shiori-health-snapshot
          path: .tmp/snapshots/
          retention-days: 90
          overwrite: true
