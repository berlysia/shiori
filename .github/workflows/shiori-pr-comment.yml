name: shiori PR comment

on:
  pull_request:
    branches: [master]

permissions: {}

jobs:
  delta-comment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Download baseline artifact from the latest main branch workflow run.
      # actions/download-artifact@v4 only works within the same workflow run,
      # so we use the GitHub API to fetch cross-workflow artifacts.
      - name: Download baseline scan artifact
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');

            const workflows = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const baselineWorkflow = workflows.data.workflows.find(
              w => w.name === 'shiori baseline'
            );
            if (!baselineWorkflow) {
              console.log('No baseline workflow found, skipping');
              return;
            }

            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: baselineWorkflow.id,
              branch: 'master',
              status: 'success',
              per_page: 1,
            });
            if (runs.data.workflow_runs.length === 0) {
              console.log('No successful baseline runs found, skipping');
              return;
            }

            const runId = runs.data.workflow_runs[0].id;

            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const artifact = artifacts.data.artifacts.find(
              a => a.name === 'shiori-base-scan'
            );
            if (!artifact) {
              console.log('No baseline scan artifact found, skipping');
              return;
            }

            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifact.id,
              archive_format: 'zip',
            });

            fs.mkdirSync('.tmp', { recursive: true });
            const zipPath = '.tmp/shiori-base-scan.zip';
            fs.writeFileSync(zipPath, Buffer.from(download.data));

            require('child_process').execFileSync('unzip', ['-o', zipPath, '-d', '.tmp/']);
            console.log('Baseline scan artifact downloaded successfully');
        continue-on-error: true

      - name: Scan annotations (PR head)
        run: node packages/shiori-cli/dist/src/cli.js scan --output .tmp/shiori-head-scan.json

      - name: Compute delta
        id: delta
        run: |
          node packages/shiori-cli/dist/src/cli.js delta \
            --base .tmp/shiori-base-scan.json \
            --head .tmp/shiori-head-scan.json \
            --format markdown \
            --added-only \
            --base-fallback-empty \
            --max-increase 0 \
            --output .tmp/shiori-delta.md
        continue-on-error: true

      - name: Generate triage report
        run: |
          node packages/shiori-cli/dist/src/cli.js triage \
            --format markdown \
            --output .tmp/shiori-triage.md
        continue-on-error: true

      - name: Generate fix preview
        run: |
          node packages/shiori-cli/dist/src/cli.js fix \
            --format markdown \
            --output .tmp/shiori-fix-preview.md
        continue-on-error: true

      # Assemble PR comment body from delta, fix preview, triage, and onboarding footer
      - name: Assemble PR comment body
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');

            const sections = [];

            // Delta report
            let delta;
            try {
              delta = fs.readFileSync('.tmp/shiori-delta.md', 'utf-8').trim();
            } catch {
              delta = '_No delta report generated._';
            }
            sections.push(delta);

            // Fix preview (already wrapped in <details> by CLI)
            let fixPreview;
            try {
              fixPreview = fs.readFileSync('.tmp/shiori-fix-preview.md', 'utf-8').trim();
            } catch {
              fixPreview = null;
            }
            if (fixPreview) {
              sections.push('');
              sections.push(fixPreview);
            }

            // Triage report (collapsed)
            let triage;
            try {
              triage = fs.readFileSync('.tmp/shiori-triage.md', 'utf-8').trim();
            } catch {
              triage = null;
            }
            if (triage) {
              sections.push('');
              sections.push('<details>');
              sections.push('<summary>📋 Triage Report</summary>');
              sections.push('');
              sections.push(triage);
              sections.push('');
              sections.push('</details>');
            }

            // Zero-click onboarding footer
            sections.push('');
            sections.push('---');
            sections.push('');
            sections.push('<details>');
            sections.push('<summary>🔖 What is shiori?</summary>');
            sections.push('');
            sections.push('**shiori** tracks lint-disable annotations and other code exceptions in a structured registry,');
            sections.push('keeping technical debt visible and governable.');
            sections.push('');
            sections.push('#### Quick Start');
            sections.push('');
            sections.push('```bash');
            sections.push('# Install');
            sections.push('pnpm add -D shiori');
            sections.push('');
            sections.push('# Initialize with starter templates');
            sections.push('pnpm shiori init --starter');
            sections.push('');
            sections.push('# Scan your codebase');
            sections.push('pnpm shiori scan');
            sections.push('');
            sections.push('# See what needs attention');
            sections.push('pnpm shiori check');
            sections.push('```');
            sections.push('');
            sections.push('[Learn more](https://github.com/berlysia/shiori)');
            sections.push('');
            sections.push('</details>');

            const body = sections.join('\n');
            fs.mkdirSync('.tmp', { recursive: true });
            fs.writeFileSync('.tmp/shiori-comment.md', body);

      # Post assembled comment to PR (create or update existing shiori comment)
      - name: Post PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          BODY="<!-- shiori-delta -->
          $(cat .tmp/shiori-comment.md)"

          # Find existing shiori comment by marker
          COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("<!-- shiori-delta -->")) | .id' \
            | head -1)

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" \
              -X PATCH -f body="$BODY"
          else
            gh pr comment "$PR_NUMBER" --body "$BODY"
          fi

      # Fail CI if annotation count exceeded threshold
      - name: Fail if annotation count increased
        if: steps.delta.outcome == 'failure'
        run: |
          echo "::error::shiori delta: annotation count exceeded --max-increase threshold"
          exit 1
