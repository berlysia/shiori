name: shiori badge

on:
  push:
    branches: [master]
  schedule:
    # Daily at 00:00 UTC
    - cron: '0 0 * * *'

permissions: {}

jobs:
  badge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 'lts/*'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Generate shields.io endpoint JSON from governance score
      - name: Generate badge JSON
        run: node packages/shiori-cli/dist/src/cli.js report --format badge --output .tmp/shiori-badge.json

      # Upload badge as artifact for score tracking over time
      - name: Upload badge artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shiori-badge
          path: .tmp/shiori-badge.json
          retention-days: 90
          overwrite: true

      # Upload to Gist for live README badge (requires GIST_TOKEN secret)
      # secrets-outside-env: GIST_TOKEN has gist-only scope, environment protection not needed
      - name: Upload to Gist
        if: env.GIST_TOKEN != ''
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ vars.SHIORI_BADGE_GIST_ID }}
        run: |
          GH_TOKEN="$GIST_TOKEN" gh gist edit "$GIST_ID" --add .tmp/shiori-badge.json
