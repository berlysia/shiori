name: shiori badge

on:
  push:
    branches: [master]
  schedule:
    # Daily at 00:00 UTC
    - cron: '0 0 * * *'

permissions: {}

jobs:
  badge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Generate shields.io endpoint JSON from governance score
      - name: Generate badge JSON
        run: node packages/shiori-cli/dist/src/cli.js report --format badge --output .tmp/shiori-badge.json

      # Upload badge as artifact for score tracking over time
      - name: Upload badge artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shiori-badge
          path: .tmp/shiori-badge.json
          retention-days: 90
          overwrite: true

      # Upload to Gist for live README badge (requires GIST_TOKEN secret)
      # secrets-outside-env: GIST_TOKEN has gist-only scope, environment protection not needed
      - name: Upload to Gist
        if: env.GIST_TOKEN != ''
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ vars.SHIORI_BADGE_GIST_ID }}
        run: |
          GH_TOKEN="$GIST_TOKEN" gh gist edit "$GIST_ID" --add .tmp/shiori-badge.json
