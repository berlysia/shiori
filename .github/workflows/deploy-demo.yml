name: Deploy demo

on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history needed for provenance (git blame)
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@lts
          cache: true
          require-lockfile: true

      - run: pnpm build

      - name: Generate HTML governance report
        run: node packages/shiori-cli/dist/src/cli.js report --format html --timeline --provenance --output _site/index.html

      - name: Build playground
        run: pnpm --filter @berlysia/shiori run build:playground

      - name: Copy playground to _site
        run: |
          mkdir -p _site/playground
          cp packages/shiori-cli/playground/shiori-playground.js _site/playground/
          cp packages/shiori-cli/playground/shiori-playground.js.map _site/playground/
          cp packages/shiori-cli/playground/index.html _site/playground/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
