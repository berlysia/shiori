name: shiori expires alert

on:
  schedule:
    # Every Monday at 9:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Manual trigger

permissions: {}

jobs:
  check-expires:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@lts
          cache: true
          require-lockfile: true

      - run: pnpm build

      - name: Check for expiring annotations
        id: shiori
        run: |
          # Run check with expiring-soon and expired as errors
          node packages/shiori-cli/dist/src/cli.js check \
            --fail-on expiring-soon,expired \
            --expiring-threshold 30 \
            -f json \
            -o .tmp/shiori-expires.json 2>/dev/null || true

          # Extract counts for downstream steps
          EXPIRING=$(jq '.summary.byType["expiring-soon"] // 0' .tmp/shiori-expires.json)
          EXPIRED=$(jq '.summary.byType["expired"] // 0' .tmp/shiori-expires.json)
          echo "expiring=$EXPIRING" >> "$GITHUB_OUTPUT"
          echo "expired=$EXPIRED" >> "$GITHUB_OUTPUT"

      - name: Create issue if expiring annotations found
        if: steps.shiori.outputs.expiring != '0' || steps.shiori.outputs.expired != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          SHIORI_EXPIRED: ${{ steps.shiori.outputs.expired }}
          SHIORI_EXPIRING: ${{ steps.shiori.outputs.expiring }}
        run: |
          TITLE="shiori: $(date +%Y-%m-%d) — ${SHIORI_EXPIRED} expired, ${SHIORI_EXPIRING} expiring soon"

          # Generate markdown report for issue body
          BODY=$(node packages/shiori-cli/dist/src/cli.js check \
            --fail-on expiring-soon,expired \
            --expiring-threshold 30 \
            -f markdown 2>/dev/null || true)

          gh issue create --title "$TITLE" --body "$BODY" --label "governance"
