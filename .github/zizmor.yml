rules:
  cache-poisoning:
    ignore:
      # The npm-stage job's actions/setup-node sets no cache input, and setup-node only
      # auto-caches when packageManager names npm (this repo uses pnpm), so nothing is restored.
      - release.yml
  template-injection:
    ignore:
      # Composite action uses ${{ inputs.* }} and ${{ steps.*.outputs.* }} in run: blocks,
      # which is standard practice. Inputs are controlled by the calling workflow, not external actors.
      - action.yml
  secrets-outside-env:
    ignore:
      # GIST_TOKEN has gist-only write scope; environment protection is unnecessary overhead.
      - shiori-badge.yml
  adhoc-packages:
    ignore:
      # Staged publishing needs npm >= 11.15.0, which the npm bundled with lts/* does not guarantee.
      # The version is pinned exactly and verified by the next command in the same step.
      - release.yml:93
