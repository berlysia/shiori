rules:
  cache-poisoning:
    ignore:
      # actions/setup-node does not enable caching by default (cache input defaults to '').
      # This is a false positive from zizmor detecting pnpm/action-setup in the same job.
      - release.yml
  template-injection:
    ignore:
      # Composite action uses ${{ inputs.* }} and ${{ steps.*.outputs.* }} in run: blocks,
      # which is standard practice. Inputs are controlled by the calling workflow, not external actors.
      - action.yml
  secrets-outside-env:
    ignore:
      # GIST_TOKEN has gist-only write scope; environment protection is unnecessary overhead.
      - shiori-badge.yml
